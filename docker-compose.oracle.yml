x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ytbot
      POSTGRES_USER: ytbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      PGTZ: ${TZ}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytbot -d ytbot"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: ${TZ}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ}
      PORT: 4000
      DATABASE_URL: postgresql://ytbot:${POSTGRES_PASSWORD}@postgres:5432/ytbot?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
      COOKIE_DOMAIN: ""
      EXPORT_DIR: /app/storage/exports
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID}
      FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY}
    volumes:
      - exports:/app/storage/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run db:seed && npm run start -w @ytbot/api"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "2gb"
    environment:
      NODE_ENV: production
      TZ: ${TZ}
      DATABASE_URL: postgresql://ytbot:${POSTGRES_PASSWORD}@postgres:5432/ytbot?schema=public
      REDIS_URL: redis://redis:6379
      EXPORT_DIR: /app/storage/exports
      WORKER_ID: oracle-worker-1
      HEADLESS_BROWSER: "true"
      DEFAULT_CAPTURE_SPEED_MS: ${DEFAULT_CAPTURE_SPEED_MS}
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - exports:/app/storage/exports
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro,Z
    depends_on:
      api:
        condition: service_healthy
    command: npm run start -w @ytbot/worker
    stop_grace_period: 30s
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ}
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  exports:
  caddy-data:
  caddy-config:
